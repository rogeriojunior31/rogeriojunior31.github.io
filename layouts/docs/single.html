{{ define "main" }}
  {{ if .Params.docsStatusPage }}
    <article class="docs-hub">
      <header class="mt-5 max-w-prose"><h1 class="mt-0 text-4xl font-extrabold text-neutral-900 dark:text-neutral">{{ .Title }}</h1></header>
      <div class="mt-6 prose dark:prose-invert max-w-none docs-main"><div class="article-content" style="max-width:none">{{ .Content }}</div></div>
    </article>
  {{ else }}
    {{ partial "docs/page.html" . }}
  {{ end }}
{{ end }}
