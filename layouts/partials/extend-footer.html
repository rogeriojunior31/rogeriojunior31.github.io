<div class="tmux-bar" aria-hidden="true">
  <span class="tmux-session">[0]</span>
  <span class="tmux-win">rogerio@archlinux</span>
  <span class="tmux-path" data-tmux-path>~</span>
  <span class="tmux-clock" data-tmux-clock></span>
</div>
<script>
(() => {
  // O tema usa keyup; input também cobre colar texto e o botão nativo de limpar.
  document.addEventListener("DOMContentLoaded", () => {
    const search = document.getElementById("search-query");
    if (!search || typeof executeQuery !== "function") return;
    const query = executeQuery;
    executeQuery = (term) => {
      if (term.trim()) return query(term);
      document.getElementById("search-results").replaceChildren();
      hasResults = false;
    };
    // Reaplica a consulta quando o índice chega, inclusive em conexões lentas.
    if (typeof fetchJSON === "function") {
      const loadJSON = fetchJSON;
      fetchJSON = (path, callback) => loadJSON(path, (data) => {
        callback(data);
        if (search.value) executeQuery(search.value);
      });
    }
    search.onkeyup = null;
    search.addEventListener("input", () => executeQuery(search.value));
  }, { once: true });
  const docsNav = document.querySelector("[data-docs-nav]");
  if (docsNav) {
    const mobile = matchMedia("(max-width: 899px)");
    const updateNav = () => { docsNav.open = !mobile.matches; };
    updateNav();
    mobile.addEventListener("change", updateNav);
  }
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // Barra do tmux: caminho da página atual e relógio.
  const path = document.querySelector("[data-tmux-path]");
  if (path) path.textContent = "~" + decodeURIComponent(location.pathname).replace(/\/$/, "");
  const clock = document.querySelector("[data-tmux-clock]");
  const tick = () => { if (clock) clock.textContent = new Date().toLocaleString(document.documentElement.lang || "pt-BR", { weekday: "short", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }); };
  tick(); setInterval(tick, 30000);

  // Home: carrossel dos showcases. Avança sozinho, exceto com movimento reduzido, mouse ou foco
  // dentro, vídeo tocando, aba oculta ou carrossel fora da tela.
  document.querySelectorAll("[data-carousel]").forEach((root) => {
    const track = root.querySelector("[data-carousel-track]");
    const dots = [...root.querySelectorAll("[data-carousel-dot]")];
    const n = track.children.length;
    const index = () => Math.round(track.scrollLeft / track.clientWidth);
    const go = (i) => track.scrollTo({ left: ((i + n) % n) * track.clientWidth });
    dots.forEach((d, i) => d.addEventListener("click", () => go(i)));
    track.addEventListener("scroll", () => {
      const i = index();
      dots.forEach((d, j) => (i === j ? d.setAttribute("aria-current", "true") : d.removeAttribute("aria-current")));
    }, { passive: true });
    if (reduce) return;
    let hover = false, visible = true;
    root.addEventListener("pointerenter", () => { hover = true; });
    root.addEventListener("pointerleave", () => { hover = false; });
    if ("IntersectionObserver" in window) new IntersectionObserver(([e]) => { visible = e.isIntersecting; }).observe(root);
    const busy = () => hover || !visible || document.hidden || root.contains(document.activeElement)
      || [...root.querySelectorAll("video")].some((v) => !v.paused);
    setInterval(() => { if (!busy()) go(index() + 1); }, 7000);
  });

  if (reduce) return;

  // Digita o texto de um elemento, caractere por caractere.
  const type = async (el, speed) => {
    const text = el.textContent.trim();
    el.textContent = "";
    el.classList.add("is-typing");
    for (const ch of text) { el.textContent += ch; await sleep(speed + Math.random() * speed); }
    el.classList.remove("is-typing");
  };

  // Terminais: comandos digitados, saídas impressas linha a linha, quando o terminal entra na tela.
  const play = async (term) => {
    const lines = [...term.querySelectorAll(".term-line")];
    for (const line of lines) {
      line.classList.remove("is-pending");
      const text = line.querySelector(".term-text");
      if (text) { await sleep(250); await type(text, 30); await sleep(200); }
      else if (!line.classList.contains("term-idle")) await sleep(120);
    }
  };
  const terms = document.querySelectorAll("[data-term]");
  terms.forEach((t) => t.querySelectorAll(".term-line").forEach((l) => l.classList.add("is-pending")));
  if ("IntersectionObserver" in window) {
    const seen = new IntersectionObserver((entries) => entries.forEach((e) => {
      if (e.isIntersecting) { seen.unobserve(e.target); play(e.target); }
    }), { threshold: 0.25 });
    terms.forEach((t) => seen.observe(t));
  } else terms.forEach(play);

  // Títulos digitados, exceto em páginas com terminal no conteúdo (o aviso de cookies do rodapé não conta).
  // Na home, a linha do cargo (h2 logo após o nome) é digitada em seguida.
  const h1 = document.querySelector("#main-content h1");
  if (h1 && !document.querySelector(".docs-layout, .docs-hub, #main-content [data-term]") && h1.children.length === 0) {
    const next = h1.parentElement?.tagName === "HEADER" ? h1.nextElementSibling : null;
    const sub = next?.tagName === "H2" && next.children.length === 0 ? next : null;
    if (sub) sub.style.visibility = "hidden";
    type(h1, 22).then(async () => {
      if (!sub) return;
      await sleep(150);
      sub.style.visibility = "";
      await type(sub, 30);
    });
  }

  // Cards aparecem em sequência, como saída de comando.
  document.querySelectorAll("#main-content .article-link--card").forEach((el, i) => {
    el.style.setProperty("--d", Math.min(i, 8) * 80 + "ms");
    el.classList.add("term-in");
  });
})();
</script>
