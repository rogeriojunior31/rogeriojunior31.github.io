# Publica no GitHub Pages a cada push na main e quando um projeto lança uma release
# (repository_dispatch "docs-release", enviado pelo project-docs.yml do projeto).
# O schedule diário cobre um projeto sem o token de aviso configurado.
# Permissão de escrita só no job de deploy, que usa apenas a action oficial.
name: Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [docs-release]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      deploy: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
