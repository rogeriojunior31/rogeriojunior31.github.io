# Projetos com documentação em /docs/. Cada um precisa de um import em config/_default/module.toml
# montando o docs/ do repositório em assets/docs/<slug>/.
# Para um site de docs externo, adicione url: "https://..."; não precisa de import.
# urlLanguage informa o idioma da URL padrão. urls: {pt-br: "https://...", en: "https://..."}
# seleciona traduções disponíveis; sem tradução, usa url e informa seu idioma.
- slug: lazyagents
  name: lazyagents
  repo: rogeriojunior31/lazyagents
  branch: main
  # Onde ficam as traduções: "repo" (docs/pt-br/ no projeto) ou "site" (docs-site/<slug>/pt-br/ aqui).
  translations: repo
  summary:
    pt-br: "TUI e CLI em Go para gerenciar skills, sessões, consumo, providers e hooks dos seus agentes de código."
    en: "A Go TUI and CLI to manage your coding agents' skills, sessions, usage, providers and hooks."
- slug: sp-night
  name: SP Night
  repo: sp-night/sp-night
  branch: main
  translations: repo
  summary:
    pt-br: "Um tema escuro com São Paulo como referência: o contrato da paleta, o motor spn e o guia para criar um port."
    en: "A dark colour scheme with São Paulo as its reference: the palette contract, the spn engine and the guide to adding a port."
- slug: vults
  name: Vults
  repo: rogeriojunior31/Vults
  branch: main
  translations: repo
  # A partir da v0.1.7 o nome e o resumo vêm do docs/site.json do projeto; este é o fallback.
  summary:
    pt-br: "App de desktop em Rust e Tauri: cada sessão do Claude Code, Codex, Gemini CLI e Antigravity vira um urubu 8-bit, com aprovações, chat e o Zeca."
    en: "A Rust and Tauri desktop app: every Claude Code, Codex, Gemini CLI and Antigravity session becomes an 8-bit vulture, with approvals, chat and Zeca."
