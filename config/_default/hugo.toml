baseURL = "https://rogeriojunior31.github.io/"
defaultContentLanguage = "pt-br"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
summaryLength = 0
enableEmoji = true

[services.googleAnalytics]
  ID = "G-YCKMFCQ44T"

[pagination]
  pagerSize = 100

[imaging]
  anchor = "Center"

[taxonomies]
  tag = "tags"
  category = "categories"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]
