[hugoVersion]
extended = true
min = "0.163.0"

[[imports]]
path = "github.com/nunocoracao/blowfish/v3"

# Docs dos projetos: a pasta docs/ de cada repositório vira assets/docs/<slug>/ e
# o content adapter em content/docs/_content.gotmpl gera as páginas. Registro em data/docs.yaml.
# Testar docs locais ainda não publicados:
#   HUGO_MODULE_REPLACEMENTS="github.com/rogeriojunior31/lazyagents -> $HOME/Projects/lazyagents" hugo server
[[imports]]
path = "github.com/rogeriojunior31/lazyagents"
[[imports.mounts]]
source = "docs"
target = "assets/docs/lazyagents"
files = ["! **.go", "! dev/**"]

# SP Night: além dos docs, a paleta oficial e o catálogo de ports viram dados do site
# (hugo.Data.spnight: palette, ports, copy), usados pelo showcase na mesma versão dos docs.
#   HUGO_MODULE_REPLACEMENTS="github.com/sp-night/sp-night -> $HOME/Projects/SP-Night/sp-night" hugo server
[[imports]]
path = "github.com/sp-night/sp-night"
[[imports.mounts]]
source = "docs"
target = "assets/docs/sp-night"
files = ["! **.go", "! dev/**"]
[[imports.mounts]]
source = "palette/sp_night.json"
target = "data/spnight/palette.json"
[[imports.mounts]]
source = "registry/ports.yml"
target = "data/spnight/ports.yml"
[[imports.mounts]]
source = "registry/copy.yml"
target = "data/spnight/copy.yml"

# Vults: só os docs (o showcase lê o logo e as screenshots da ilha de docs/assets/).
# O nome do repositório tem maiúscula; o Go guarda o módulo como "!vults" no cache, sem problema.
#   HUGO_MODULE_REPLACEMENTS="github.com/rogeriojunior31/Vults -> $HOME/Projects/Vults" hugo server
[[imports]]
path = "github.com/rogeriojunior31/Vults"
[[imports.mounts]]
source = "docs"
target = "assets/docs/vults"
files = ["! dev/**"]

# Camada de docs do próprio site (traduções pt-BR e páginas que só existem aqui), em docs-site/<slug>/<idioma>/.
# Declarar um mount do projeto desliga os padrões do componente "assets", por isso ele é repetido.
[[mounts]]
source = "assets"
target = "assets"
[[mounts]]
source = "docs-site"
target = "assets/docs-site"
